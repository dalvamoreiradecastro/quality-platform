name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1-5' # regressão diária nos dias úteis

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  api:
    name: API tests (local environment)
    needs: static-analysis
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Start local environment
        run: docker compose up -d --wait restful-booker
      - run: npx playwright test --project=api
      - name: Service logs on failure
        if: failure()
        run: docker compose logs restful-booker
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-api
          path: blob-report
          retention-days: 7

  ui:
    name: UI tests (${{ matrix.project }})
    needs: static-analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [e2e-chromium, e2e-firefox, a11y]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report
          retention-days: 7

  report:
    name: Merge report
    needs: [api, ui]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: playwright-report
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: playwright-report

  # Job separado: o ambiente "github-pages" só aceita deploy a partir da main.
  # Em PRs este job é pulado, e o relatório fica disponível como artefato "html-report".
  deploy-report:
    name: Publish report to GitHub Pages
    needs: report
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  api-public:
    name: API tests (public environment)
    # Ambiente compartilhado e fora do nosso controle: não bloqueia PR,
    # roda na regressão agendada para detectar divergências entre ambientes.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright test --project=api --reporter=github,list

  performance:
    name: Performance load test (k6, local environment)
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare report folder (k6 container runs as non-root)
        run: mkdir -p performance/reports && chmod 777 performance/reports
      - name: Run k6 load profile
        run: docker compose --profile perf run --rm k6 run -e PROFILE=load booking-load.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: k6-report
          path: performance/reports
          retention-days: 14
      - name: Tear down
        if: always()
        run: docker compose down
